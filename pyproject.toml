[project]
name = "kontra-ki"
version = "0.1.0"
description = "MCP server that sends ideas to a local LM Studio model for adversarial review"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kontra_ki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
