[project]
name = "kontra-ki"
version = "0.1.0"
description = "MCP-Server, der Ideen an eine lokale LM-Studio-KI zur kritischen Gegenpruefung schickt"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kontra_ki"]
